name: opspilot-test

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: opspilot_test
      POSTGRES_USER: opspilot_test
      POSTGRES_PASSWORD: opspilot_local_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U opspilot_test -d opspilot_test
      interval: 2s
      timeout: 5s
      retries: 30
